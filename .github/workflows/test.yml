name: text-seeker tests

on:
  push:
    paths:
      - '**.py'
      - 'tests/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '**.py'
      - 'tests/**'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
